# SPDX-License-Identifier: AGPL-3.0-or-later
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[gui,test]'
      - run: pytest -q
      - name: Installer runs end to end
        run: PADSQUIRE_SOURCE="$PWD[gui]" sh install.sh < /dev/null && ~/.local/bin/padsquire --version
