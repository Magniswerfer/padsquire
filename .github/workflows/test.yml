# SPDX-License-Identifier: AGPL-3.0-or-later
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.2 shellcheck-py==0.11.0.1   # the versions .pre-commit-config.yaml pins
      - run: ruff check --output-format=github src tests tools
      - name: Shell scripts (the installer runs under plain sh)
        run: shellcheck --shell=sh install.sh tools/*.sh
      - name: The settings app's script parses
        run: node --check src/padsquire/web/static/app.js

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[gui,test]'
      - run: pytest -q
      - name: Installer runs end to end
        run: PADSQUIRE_SOURCE="$PWD[gui]" sh install.sh < /dev/null && ~/.local/bin/padsquire --version

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[gui,test]'
      - run: pytest -q
      - name: Installer runs end to end
        run: PADSQUIRE_SOURCE="$PWD[gui]" sh install.sh < /dev/null && ~/.local/bin/padsquire --version && test -x ~/Applications/PadSquire.app/Contents/MacOS/PadSquire
