# SPDX-License-Identifier: AGPL-3.0-or-later
# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish that version to PyPI.
# PyPI trusts this workflow directly ("trusted publishing"), so no API token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }
      - run: pip install -e '.[gui,test]' build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # install.sh goes on every release, so .../releases/latest/download/install.sh is the newest,
      # and installs exactly this version (VERSION="" becomes VERSION="0.1.3").
      - name: install.sh installs this release
        run: |
          sed -i "s/^VERSION=\"\"$/VERSION=\"${GITHUB_REF_NAME#v}\"/" install.sh
          grep -q "^VERSION=\"${GITHUB_REF_NAME#v}\"$" install.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
