<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PadSquire</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/img/icon-512.png" type="image/png" sizes="512x512">
<link rel="preload" href="/static/ds/fonts/young-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/ds/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/ds/tokens.css">
<link rel="stylesheet" href="/static/ds/components.css">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/pad-model.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="app-bar">
  <span class="app-title"><span class="logo" id="logo" aria-hidden="true"></span>PadSquire <span class="app-device">Nova 2 Lite</span></span>
  <div class="app-status" id="status" aria-live="polite"></div>
</header>

<main class="layout">
  <aside class="side" aria-label="Controller">
    <pad-model id="pad" src="/static/models/nova-2-lite.glb" role="img" aria-label="Your controller">
      <img class="pad-drawing" src="/static/img/nova-2-lite-angle.svg" width="640" height="480" alt="">
    </pad-model>

    <nav aria-label="Settings">
      <ul class="navlist" id="nav"></ul>
    </nav>

    <div class="side-foot">
      <div class="segmented" role="radiogroup" aria-label="Theme" id="theme">
        <input type="radio" name="theme" id="theme-auto" value="auto" checked><label for="theme-auto">System</label>
        <input type="radio" name="theme" id="theme-light" value="light"><label for="theme-light">Light</label>
        <input type="radio" name="theme" id="theme-dark" value="dark"><label for="theme-dark">Dark</label>
      </div>
      <p class="source">PadSquire, free software under the AGPL.
        <a href="https://github.com/Magniswerfer/padsquire" target="_blank" rel="noopener">Source code</a></p>
    </div>
  </aside>

  <section class="panel sheet" id="panel" tabindex="-1" aria-live="polite"></section>
</main>

<div class="toasts" id="toasts" role="status" aria-live="assertive"></div>

<dialog id="confirm" class="dialog">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button value="cancel" class="button">Cancel</button>
      <button value="ok" class="button primary" id="confirm-ok"></button>
    </div>
  </form>
</dialog>
</body>
</html>
