<!-- The Nova 2 Lite, drawn after its manual. The one copy of the drawing: pages inline this file
     and style it with .pad in components.css. Parts carry data-part, the stick caps data-stick.
     The standalone styles below only matter when the file is shown on its own; inlining code
     removes that element before parsing. -->
<svg xmlns="http://www.w3.org/2000/svg" class="pad" viewBox="0 -8 400 298" role="img" aria-labelledby="pad-title">
  <title id="pad-title">GameSir Nova 2 Lite</title>
  <style id="standalone">
    :where(.pad) * { fill: #fffffe; stroke: #2c48a8; stroke-width: 1.6; stroke-linejoin: round; }
    :where(.pad) .edge, :where(.pad) .texture, :where(.pad) .underside { fill: none; }
    :where(.pad) .texture { stroke-width: 2.2; stroke-dasharray: .8 1.6; }
    :where(.pad) .underside { stroke-dasharray: 4 3; }
    :where(.pad) .glyph { fill: #2c48a8; stroke: none; font: 700 10px sans-serif; text-anchor: middle; dominant-baseline: central; }
    :where(.pad) .glyph.small { font-size: 9px; }
  </style>
