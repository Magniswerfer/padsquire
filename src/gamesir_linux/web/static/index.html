<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova 2 Lite</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-title">
    <span class="product">Nova 2 Lite</span>
    <span class="tool">GameSir Linux</span>
  </div>
  <div class="bar-status" id="status" aria-live="polite"></div>
</header>

<main class="layout">
  <aside class="map" aria-label="Controller">
    <svg id="pad" class="pad" viewBox="0 0 400 290" role="group" aria-label="Controller map: choose a part to configure">
      <!-- triggers and bumpers sit behind the shell -->
      <g class="part" data-section="triggers" tabindex="0" role="button" aria-label="Triggers">
        <title>Triggers</title>
        <path class="plastic" d="M88 44 C92 22 112 14 136 18 L150 22 C156 24 158 32 154 40 L150 50 Z"/>
        <path class="plastic" d="M312 44 C308 22 288 14 264 18 L250 22 C244 24 242 32 246 40 L250 50 Z"/>
        <text class="part-label" x="122" y="36">LT</text>
        <text class="part-label" x="278" y="36">RT</text>
      </g>
      <g class="part" data-section="buttons" tabindex="0" role="button" aria-label="Bumpers">
        <title>Bumpers</title>
        <path class="plastic" d="M70 64 C76 48 96 40 120 42 L160 46 C166 47 168 54 164 58 L80 70 Z"/>
        <path class="plastic" d="M330 64 C324 48 304 40 280 42 L240 46 C234 47 232 54 236 58 L320 70 Z"/>
      </g>

      <!-- shell: not interactive itself -->
      <path class="shell" d="M124 56 C164 48 236 48 276 56 L316 62 C350 68 370 96 380 136 C392 186 394 230 370 250 C348 268 316 258 300 236 L278 204 C268 192 256 188 242 188 L158 188 C144 188 132 192 122 204 L100 236 C84 258 52 268 30 250 C6 230 8 186 20 136 C30 96 50 68 84 62 Z"/>

      <!-- the grips hold the rumble motors -->
      <g class="part grips" data-section="vibration" tabindex="0" role="button" aria-label="Grips: vibration">
        <title>Grips: vibration</title>
        <path class="grip" d="M24 160 C18 196 18 232 34 246 C54 262 82 254 98 232 L112 212 C96 196 70 176 24 160 Z"/>
        <path class="grip" d="M376 160 C382 196 382 232 366 246 C346 262 318 254 302 232 L288 212 C304 196 330 176 376 160 Z"/>
      </g>

      <!-- back buttons, on the underside of the grips -->
      <g class="part back" data-section="buttons" tabindex="0" role="button" aria-label="Back buttons">
        <title>Back buttons (underneath)</title>
        <rect class="underside" x="40" y="206" width="44" height="18" rx="9" transform="rotate(-24 62 215)"/>
        <rect class="underside" x="316" y="206" width="44" height="18" rx="9" transform="rotate(24 338 215)"/>
        <text class="part-label small" x="62" y="244">L4</text>
        <text class="part-label small" x="338" y="244">R4</text>
      </g>

      <g class="part" data-section="sticks" tabindex="0" role="button" aria-label="Sticks">
        <title>Sticks</title>
        <circle class="well" cx="104" cy="112" r="30"/>
        <circle class="cap" cx="104" cy="112" r="20"/>
        <circle class="well" cx="250" cy="158" r="30"/>
        <circle class="cap" cx="250" cy="158" r="20"/>
      </g>

      <g class="part" data-section="buttons" tabindex="0" role="button" aria-label="Face buttons and D-pad">
        <title>Buttons</title>
        <path class="key" d="M142 132 h12 v14 h14 v12 h-14 v14 h-12 v-14 h-14 v-12 h14 z"/>
        <circle class="key" cx="296" cy="92" r="10"/>
        <circle class="key" cx="296" cy="132" r="10"/>
        <circle class="key" cx="276" cy="112" r="10"/>
        <circle class="key" cx="316" cy="112" r="10"/>
        <rect class="key" x="166" y="112" width="18" height="9" rx="4.5"/>
        <rect class="key" x="216" y="112" width="18" height="9" rx="4.5"/>
        <rect class="key" x="194" y="136" width="12" height="9" rx="2"/>
      </g>

      <g class="part" data-section="lighting" tabindex="0" role="button" aria-label="Home light">
        <title>Home light</title>
        <circle class="led-glow" cx="200" cy="88" r="20"/>
        <circle class="led" cx="200" cy="88" r="11"/>
      </g>
    </svg>

    <nav class="sections" aria-label="Settings">
      <ul id="nav"></ul>
    </nav>
  </aside>

  <section class="panel" id="panel" tabindex="-1" aria-live="polite"></section>
</main>

<div class="toasts" id="toasts" role="status" aria-live="assertive"></div>

<dialog id="confirm" class="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button value="cancel" class="btn">Cancel</button>
      <button value="ok" class="btn danger" id="confirm-ok"></button>
    </div>
  </form>
</dialog>
</body>
</html>
