[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "padsquire"
version = "0.2.0"
description = "PadSquire: Linux and macOS tools for GameSir controllers"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = ["hidapi>=0.14; sys_platform == 'darwin'", "pyusb>=1.2; sys_platform == 'darwin'",
                "libusb-package>=1.0.26; sys_platform == 'darwin'"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
gui = ["aiohttp>=3.9", "bleak>=0.22"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.17", "pre-commit>=4"]

[project.scripts]
padsquire = "padsquire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"padsquire" = ["data/*"]
"padsquire.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["installer: needs a real GameSir Connect installer (set PADSQUIRE_INSTALLER)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# Long lines are wrapped by hand, and short named lambdas are kept where they read better.
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
# Tests import per section and keep short timelines on one line.
"tests/*" = ["E402", "E702"]
