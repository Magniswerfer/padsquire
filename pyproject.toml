[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "padsquire"
version = "0.1.0"
description = "PadSquire: Linux tools for GameSir controllers"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
gui = ["aiohttp>=3.9", "bleak>=0.22"]
test = ["pytest>=8"]

[project.scripts]
padsquire = "padsquire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"padsquire" = ["data/*"]
"padsquire.web" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["installer: needs a real GameSir Connect installer (set PADSQUIRE_INSTALLER)"]
