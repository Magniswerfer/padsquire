[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesir-linux"
version = "0.1.0"
description = "Linux-native configuration and firmware tools for GameSir controllers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
test = ["pytest>=8"]

[project.scripts]
gamesir-linux = "gamesir_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["installer: needs a real GameSir Connect installer (set GAMESIR_INSTALLER)"]
